      <button class="tab" data-view="inventory">6. Inventario</button>
      <button class="tab" data-view="expenses">7. Gastos</button>
      <button class="tab" data-view="attendance">8. Asistencia</button>
      <button class="tab" data-view="finance">9. Finanzas</button>
      <button class="tab tab-download-all" data-view="backup" title="Central de respaldos" aria-label="Central de respaldos">⤓</button>
      <button class="tab tab-help" data-view="docs" title="Ayuda técnica y fórmulas" aria-label="Ayuda técnica y fórmulas">?</button>
    </nav>

    <nav class="mobile-topbar">
      <button class="tab mobile-menu-btn" data-view="mobile-home" aria-label="Menú de secciones">☰ Menú</button>
      <button class="tab tab-download-all" data-view="backup" title="Central de respaldos" aria-label="Central de respaldos">⤓</button>
      <button class="tab tab-help" data-view="docs" title="Ayuda técnica y fórmulas" aria-label="Ayuda técnica y fórmulas">?</button>

    <main class="layout">

    <input id="db-import-input" type="file" accept="application/json,.json" hidden />
    <input id="product-types-import-input" type="file" accept="application/json,.json" hidden />
    <input id="external-resources-import-input" type="file" accept="application/json,.json" hidden />
    <input id="contacts-import-input" type="file" accept="application/json,.json" hidden />
    <input id="order-import-input" type="file" accept="application/json,.json" hidden />
    <input id="expense-import-input" type="file" accept="application/json,.json" hidden />
    <input id="desired-import-input" type="file" accept="application/json,.json" hidden />
    <input id="attendance-import-input" type="file" accept="application/json,.json" hidden />

        Desarrollado por Andrés Baeza Jordán · <a href="https://andiworks.cl" target="_blank" rel="noopener noreferrer">andiworks.cl</a> / 2026

  <div id="notes-modal" class="notes-panel is-hidden" aria-hidden="true">

    <div class="notes-modal-card attendance-record-modal-card" role="dialog" aria-modal="true" aria-labelledby="attendance-record-modal-title">
      <div class="section-title">
        <h3 id="attendance-record-modal-title">Detalle de jornada</h3>
        <button class="btn btn-soft btn-mini-close" data-action="close-attendance-record-modal" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>

    </div>

  <div id="calculator-modal" class="notes-modal is-hidden" aria-hidden="true">
    <div class="notes-modal-backdrop" data-action="close-calculator"></div>
    <div class="calculator-card" role="dialog" aria-modal="true" aria-labelledby="calculator-title">

        <h3 id="calculator-title">Calculadora</h3>
        <button class="btn btn-soft btn-mini-close" data-action="close-calculator" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <input id="calculator-display" class="calculator-display" type="text" readonly value="0" />
      <div class="calculator-pad">
        <button class="btn btn-soft calc-key calc-key-wide" data-calc-action="clear">C</button>
        <button class="btn btn-soft calc-key" data-calc-action="backspace">⌫</button>
        <button class="btn btn-soft calc-key" data-calc-op="/">÷</button>
        <button class="btn btn-soft calc-key" data-calc-digit="7">7</button>
        <button class="btn btn-soft calc-key" data-calc-digit="8">8</button>
        <button class="btn btn-soft calc-key" data-calc-digit="9">9</button>
        <button class="btn btn-soft calc-key" data-calc-op="*">×</button>
        <button class="btn btn-soft calc-key" data-calc-digit="4">4</button>
        <button class="btn btn-soft calc-key" data-calc-digit="5">5</button>
        <button class="btn btn-soft calc-key" data-calc-digit="6">6</button>
        <button class="btn btn-soft calc-key" data-calc-op="-">−</button>
        <button class="btn btn-soft calc-key" data-calc-digit="1">1</button>
        <button class="btn btn-soft calc-key" data-calc-digit="2">2</button>
        <button class="btn btn-soft calc-key" data-calc-digit="3">3</button>
        <button class="btn btn-soft calc-key" data-calc-op="+">+</button>
        <button class="btn btn-soft calc-key calc-key-wide" data-calc-digit="0">0</button>
        <button class="btn btn-soft calc-key" data-calc-digit=".">.</button>
        <button class="btn btn-primary calc-key" data-calc-action="equals">=</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var footer = document.querySelector('.app-footer');
      if (!footer) return;
      var GAP = 12;

      function dockedEls() {
        var els = [document.getElementById('activity-log-widget')];
        var badge = document.querySelector('.sync-badge');
        if (badge) els.push(badge);
        return els.filter(Boolean);
      }

      // Cuando el footer de créditos entra en pantalla (página corta o scroll al final),
      // los widgets flotantes (Historial, Sincronizado) dejan de estar fijos al viewport
      // y se anclan justo encima del footer, en coordenadas reales del documento, para
      // no quedar flotando en un hueco vacío entre el contenido y el footer.
      function updateDock() {
        if (!document.body.classList.contains('footer-in-view')) return;
        var footerTop = footer.getBoundingClientRect().top + window.pageYOffset;
        dockedEls().forEach(function (el) {
          if (ro) ro.observe(el);
          var h = el.getBoundingClientRect().height;
          el.style.top = (footerTop - GAP - h) + 'px';
        });
      }

      function clearDock() {
        dockedEls().forEach(function (el) { el.style.top = ''; });
      }

      var ro = null;
      if ('ResizeObserver' in window) {
        ro = new ResizeObserver(updateDock);
        ro.observe(footer);
      }
      window.addEventListener('resize', updateDock);

      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
          var inView = entries[0].isIntersecting;
          document.body.classList.toggle('footer-in-view', inView);
          if (inView) updateDock(); else clearDock();
        }, { threshold: 0 }).observe(footer);
      }

      // El badge de sincronización se crea dinámicamente tras el login.
      new MutationObserver(updateDock).observe(document.body, { childList: true });
    })();
  </script>
